apply plugin: 'com.android.library'
android { 
    namespace 'com.ddrubok.wegetgame.widget' 
    compileSdkVersion 34 
    defaultConfig { minSdkVersion 24 }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // (기존) implementation 'com.google.mediapipe:tasks-genai:0.10.14' <- 삭제
    
    // (변경) 프로덕션 앱을 위한 ML Kit GenAI Prompt API 추가
    implementation 'com.google.mlkit:genai-prompt:1.0.0' 
    // ※ 또는 LiteRT-LM 의존성을 사용해도 구조는 동일합니다.
}